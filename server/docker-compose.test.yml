services:
  mysql-test:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: test
      MYSQL_DATABASE: app_test
    ports:
     - "3307:3306"
    tmpfs:
     - "/var/lib/mysql"         # RAM-backed, always fresh
    volumes:
     - "../schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ptest"]
      interval: 3s
      retries: 20